[project]
name = "monori-ci"
version = "0.1.0"
description = "Monori CI libraries and checks"
requires-python = ">=3.12"
dependencies = [
  "dulwich>=0.25.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "monori-common",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
monori-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/monori"]
