name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

# A new push supersedes any still-running CI for the same ref. Deploy fires off
# the newest successful run, so cancelling old ones is safe.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: ${{ matrix.target }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target:
                    - fmt-check
                    - lint
                    - typecheck
                    - analyze
                    - t-fast
                    - t-medium
                    - t-slow
                    - build
                    - coverage
                    - audit-deps
                    - audit-deps-py
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      web/package.json

            - name: Setup uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Install web deps
              run: npm install --no-audit --no-fund
              working-directory: web

            - name: Install server deps
              run: uv sync
              working-directory: server

            - name: Install Playwright browsers
              if: matrix.target == 't-slow'
              run: npx playwright install --with-deps chromium
              working-directory: web

            - name: Install external linters
              if: matrix.target == 'lint'
              env:
                  HADOLINT_VERSION: "2.12.0"
                  HADOLINT_SHA256: "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010"
                  ACTIONLINT_VERSION: "1.7.7"
                  SHFMT_VERSION: "3.10.0"
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y shellcheck

                  shfmt_bin="shfmt_v${SHFMT_VERSION}_linux_amd64"
                  curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/${shfmt_bin}" -o "${shfmt_bin}"
                  curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/sha256sums.txt" -o shfmt_sha256sums.txt
                  grep " ${shfmt_bin}\$" shfmt_sha256sums.txt | sha256sum -c -
                  sudo install -m 0755 "${shfmt_bin}" /usr/local/bin/shfmt

                  curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" -o hadolint
                  echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
                  sudo install -m 0755 hadolint /usr/local/bin/hadolint

                  tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}" -o "${tarball}"
                  curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o actionlint_checksums.txt
                  grep " ${tarball}\$" actionlint_checksums.txt | sha256sum -c -
                  tar -xzf "${tarball}" actionlint
                  sudo install -m 0755 actionlint /usr/local/bin/actionlint

            - name: Install semgrep
              if: matrix.target == 'analyze'
              run: pipx install semgrep

            - name: Run ${{ matrix.target }}
              run: make ${{ matrix.target }}

            - name: Upload Playwright report
              if: failure() && matrix.target == 't-slow'
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      web/playwright-report
                      web/test-results
                  retention-days: 7

    mutation:
        name: mutation
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: web/package.json

            - name: Setup uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Install web deps
              run: npm install --no-audit --no-fund
              working-directory: web

            - name: Install server deps
              run: uv sync
              working-directory: server

            - name: Run mutation tests
              run: make mutation

    secrets:
        name: secrets
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Scan for secrets
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
