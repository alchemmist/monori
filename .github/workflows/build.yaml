name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    schedule:
        - cron: "0 2 * * *"
    workflow_dispatch:

permissions:
    contents: read

# A new push supersedes any still-running CI for the same ref. Deploy fires off
# the newest successful run, so cancelling old ones is safe.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: ${{ matrix.target }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target:
                    - fmt-check
                    - lint
                    - typecheck
                    - analyze
                    - t-fast
                    - t-medium
                    - t-slow
                    - build
                    - coverage
                    - audit-deps
                    - audit-deps-py
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      web/package.json

            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Install web deps
              run: npm install --no-audit --no-fund
              working-directory: web

            - name: Install server deps
              run: uv sync
              working-directory: server

            - name: Install Playwright browsers
              if: matrix.target == 't-slow'
              run: npx playwright install --with-deps chromium
              working-directory: web

            - name: Install external linters
              if: matrix.target == 'lint'
              env:
                  HADOLINT_VERSION: "2.12.0"
                  HADOLINT_SHA256: "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010"
                  ACTIONLINT_VERSION: "1.7.7"
                  SHFMT_VERSION: "3.10.0"
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y shellcheck

                  shfmt_bin="shfmt_v${SHFMT_VERSION}_linux_amd64"
                  curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/${shfmt_bin}" -o "${shfmt_bin}"
                  curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/sha256sums.txt" -o shfmt_sha256sums.txt
                  grep " ${shfmt_bin}\$" shfmt_sha256sums.txt | sha256sum -c -
                  sudo install -m 0755 "${shfmt_bin}" /usr/local/bin/shfmt

                  curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" -o hadolint
                  echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
                  sudo install -m 0755 hadolint /usr/local/bin/hadolint

                  tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}" -o "${tarball}"
                  curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o actionlint_checksums.txt
                  grep " ${tarball}\$" actionlint_checksums.txt | sha256sum -c -
                  tar -xzf "${tarball}" actionlint
                  sudo install -m 0755 actionlint /usr/local/bin/actionlint

            - name: Install semgrep
              if: matrix.target == 'analyze'
              run: pipx install semgrep

            - name: Run ${{ matrix.target }}
              run: make ${{ matrix.target }}

            - name: Upload Playwright report
              if: failure() && matrix.target == 't-slow'
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      web/playwright-report
                      web/test-results
                  retention-days: 7

    mutation-pr:
        name: mutation (changed code)
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: web/package.json

            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Install web deps
              run: npm install --no-audit --no-fund
              working-directory: web

            - name: Install server deps
              run: uv sync
              working-directory: server

            - name: Restore Stryker cache
              uses: actions/cache@v4
              with:
                  path: web/reports/stryker-incremental.json
                  key: mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package.json') }}-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
                  restore-keys: |
                      mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package.json') }}-pr-${{ github.event.pull_request.number }}-
                      mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package.json') }}-main-

            - name: Restore mutmut cache
              uses: actions/cache/restore@v4
              with:
                  path: server/mutants
                  key: mutation-mutmut-${{ runner.os }}-${{ hashFiles('server/pyproject.toml') }}-main-
                  restore-keys: |
                      mutation-mutmut-${{ runner.os }}-${{ hashFiles('server/pyproject.toml') }}-main-

            - name: Test diff mutation gate
              run: python3 -m unittest scripts/test_mutation_diff_gate.py

            - name: Run diff-scoped mutation tests
              run: make mutation-diff BASE=origin/main MUTATION_DIFF_THRESHOLD=90

    mutation-full:
        name: mutation (full sweep)
        if: >-
            github.event_name == 'schedule'
            || github.event_name == 'push'
            || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 180
        permissions:
            contents: read
            issues: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: web/package.json

            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Install web deps
              run: npm install --no-audit --no-fund
              working-directory: web

            - name: Install server deps
              run: uv sync
              working-directory: server

            - name: Restore Stryker cache
              uses: actions/cache@v4
              with:
                  path: web/reports/stryker-incremental.json
                  key: mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package.json') }}-main-${{ github.sha }}
                  restore-keys: |
                      mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package.json') }}-main-

            - name: Restore mutmut cache
              uses: actions/cache@v4
              with:
                  path: server/mutants
                  key: mutation-mutmut-${{ runner.os }}-${{ hashFiles('server/pyproject.toml') }}-main-${{ github.sha }}
                  restore-keys: |
                      mutation-mutmut-${{ runner.os }}-${{ hashFiles('server/pyproject.toml') }}-main-

            - name: Run full mutation tests
              run: make mutation

            - name: Report scheduled mutation failure
              if: failure() && github.event_name == 'schedule'
              uses: actions/github-script@v7
              with:
                  script: |
                      const title = "Nightly mutation sweep failed";
                      const { owner, repo } = context.repo;
                      const { data: openIssues } = await github.rest.issues.listForRepo({
                          owner,
                          repo,
                          state: "open",
                      });
                      const body = [
                          "The scheduled full mutation sweep failed.",
                          "",
                          `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                      ].join("\n");
                      const existing = openIssues.find((issue) => issue.title === title);
                      if (existing) {
                          await github.rest.issues.createComment({
                              owner,
                              repo,
                              issue_number: existing.number,
                              body,
                          });
                      } else {
                          await github.rest.issues.create({ owner, repo, title, body });
                      }

    secrets:
        name: secrets
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Scan for secrets
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
