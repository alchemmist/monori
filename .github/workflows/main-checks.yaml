name: Main-branch checks

on:
    push:
        branches: [main]
    schedule:
        - cron: "0 23 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: main-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    fmt-check:
        name: Format check
        runs-on: ubuntu-latest
        steps:
            - name: Quality Graph command reference
              run: |
                  cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
                  ## Quality Graph commands

                  Repository administrators can use these commands in a pull-request comment:

                  - `/qg ignore <type>-<finding-id>[,<type>-<finding-id>...]` — ignore selected findings
                  - `/qg ignore <type>[,<type>...]` — ignore all current findings of selected types
                  - `/qg ignore-file path/to/file[,path/to/file...]` — ignore findings in selected files
                  - `/qg remove-ignore <type>-<finding-id>[,<type>-<finding-id>...]` — remove selected ignores
                  - `/qg status` — show command status
                  - `/qg help` — show this reference

                  `/quality-graph` is an alias for `/qg`.
                  EOF
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
                  python-profile: format
            - run: make fmt-check

    lint:
        name: Lint
        needs: fmt-check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
                  python-profile: lint
            - name: Install external linters
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y shellcheck
                  curl -sSfL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 -o "$RUNNER_TEMP/shfmt"
                  sudo install -m 0755 "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt
                  curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o "$RUNNER_TEMP/hadolint"
                  sudo install -m 0755 "$RUNNER_TEMP/hadolint" /usr/local/bin/hadolint
                  curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
                  tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP"
                  sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
            - run: make lint

    docs-links:
        name: Documentation links
        needs: fmt-check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Install Lychee
              env:
                  LYCHEE_VERSION: "0.24.2"
                  LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
              run: |
                  set -euo pipefail
                  archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
                  curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${archive}" -o "$RUNNER_TEMP/lychee.tgz"
                  echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tgz" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/lychee.tgz" -C "$RUNNER_TEMP" --strip-components=1 "lychee-x86_64-unknown-linux-gnu/lychee"
                  sudo install -m 0755 "$RUNNER_TEMP/lychee" /usr/local/bin/lychee
            - run: make docs-links

    type:
        name: Type check
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
                  python-profile: type
            - run: make type

    analyze:
        name: Static analysis
        needs: type
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
                  python-profile: analyze
            - name: Install semgrep
              run: pipx install semgrep
            - run: make analyze

    test-fast:
        name: Fast tests
        needs: analyze
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
                  python-profile: test
            - run: make t-fast

    test-medium:
        name: Medium tests
        needs: test-fast
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
                  python-profile: test
            - run: make t-medium

    test-slow:
        name: Slow tests
        needs: test-medium
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
                  python-profile: test
            - name: Restore Playwright browser cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium
              working-directory: web
            - run: make t-slow

    docs-examples:
        name: Documentation examples
        needs: test-medium
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
                  python-profile: test
            - run: make docs-examples

    build:
        name: Build
        needs: test-slow
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
            - run: make build

    coverage:
        name: Coverage
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
                  python-profile: coverage
            - run: make coverage
            - run: make coverage-baseline
            - name: Save coverage baseline
              uses: actions/cache/save@v5
              with:
                  path: coverage-baseline
                  key: coverage-baseline-v1-${{ github.sha }}

    audit:
        name: Dependency and security audit
        needs: [coverage, docs-links, docs-examples]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
                  python-profile: audit
            - run: make audit

    mutation-full-frontend:
        name: Full frontend mutation sweep
        needs: audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 180
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  install-web: true
            - name: Restore Stryker incremental state
              id: restore-stryker
              uses: actions/cache/restore@v5
              with:
                  path: web/reports/stryker-incremental.json
                  key: mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-main-${{ hashFiles('web/stryker.conf.ts') }}-${{ github.sha }}
                  restore-keys: |
                      mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-main-${{ hashFiles('web/stryker.conf.ts') }}-
                      mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-main-
            - name: Run full frontend mutation tests
              run: make m-front
            - name: Save Stryker incremental state
              if: always() && steps.restore-stryker.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: web/reports/stryker-incremental.json
                  key: mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-main-${{ hashFiles('web/stryker.conf.ts') }}-${{ github.sha }}

    mutation-full-backend:
        name: Full backend mutation sweep
        needs: audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 180
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  python-profile: mutation
            - name: Restore mutmut state
              id: restore-mutmut
              uses: actions/cache/restore@v5
              with:
                  path: mutants
                  key: mutation-mutmut-${{ runner.os }}-${{ hashFiles('uv.lock') }}-main-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
                  restore-keys: |
                      mutation-mutmut-${{ runner.os }}-${{ hashFiles('uv.lock') }}-main-${{ hashFiles('pyproject.toml') }}-
                      mutation-mutmut-${{ runner.os }}-${{ hashFiles('uv.lock') }}-main-
            - name: Run full backend mutation tests
              run: make m-back
            - name: Save mutmut state
              if: always() && steps.restore-mutmut.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: mutants
                  key: mutation-mutmut-${{ runner.os }}-${{ hashFiles('uv.lock') }}-main-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}

    mutation-full-report:
        name: Report nightly mutation failure
        needs: [mutation-full-frontend, mutation-full-backend]
        if: always() && github.event_name == 'schedule' && (needs.mutation-full-frontend.result == 'failure' || needs.mutation-full-backend.result == 'failure')
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - name: Report scheduled mutation failure
              uses: actions/github-script@v9
              env:
                  FRONTEND_RESULT: ${{ needs.mutation-full-frontend.result }}
                  BACKEND_RESULT: ${{ needs.mutation-full-backend.result }}
              with:
                  script: |
                      const title = "Nightly mutation sweep failed";
                      const { owner, repo } = context.repo;
                      const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                          owner,
                          repo,
                          state: "open",
                          per_page: 100,
                      });
                      const body = [
                          "The scheduled full mutation sweep failed.",
                          "",
                          `Frontend: ${process.env.FRONTEND_RESULT}`,
                          `Backend: ${process.env.BACKEND_RESULT}`,
                          "",
                          `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                      ].join("\n");
                      const existing = openIssues.find((issue) => !issue.pull_request && issue.title === title);
                      if (existing) await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
                      else await github.rest.issues.create({ owner, repo, title, body });
