---
name: Quality Graph Publisher
'on':
  workflow_run:
    workflows:
      - Quality Graph
    types:
      - requested
      - in_progress
      - completed
  issue_comment:
    types:
      - created
      - edited
permissions: {}
concurrency:
  group: quality-graph-publish-${{ github.event.workflow_run.id || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish Quality Graph
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Publish trusted Quality Graph state
        uses: alchemmist/quality-graph@c73c58fb1c5064546b40f481decdb7bc12c5e9fe
        with:
          operation: ${{ github.event.action == 'completed' && 'publish' || 'watch' }}
  command:
    name: Handle Quality Graph command
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Handle trusted Quality Graph command
        uses: alchemmist/quality-graph@c73c58fb1c5064546b40f481decdb7bc12c5e9fe
        with:
          operation: command
