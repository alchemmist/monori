name: Coverage report

on:
    workflow_run:
        workflows: [Quality Graph]
        types: [completed]

permissions:
    actions: read
    contents: read
    issues: write
    statuses: write

concurrency:
    group: coverage-report-${{ github.event.workflow_run.id }}
    cancel-in-progress: true

jobs:
    publish:
        name: Publish coverage report
        if: github.event.workflow_run.event == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout trusted reporter
              uses: actions/checkout@v7
              with:
                  ref: main
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
              with:
                  python-profile: ci
            - name: Download untrusted coverage evidence
              id: download
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: coverage-report
                  path: coverage-artifact
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}
            - name: Publish sticky comment and blocking status
              if: always()
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}
              run: >-
                  uv run --locked python -m monori.ci.lib.coverage_diff publish
                  --artifact coverage-artifact/report.json
                  --run-id "$RUN_ID"
                  --head-sha "$HEAD_SHA"
                  --run-url "$RUN_URL"
