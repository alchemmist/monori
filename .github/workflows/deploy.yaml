name: Deploy

# Rolls out a release after the CI workflow succeeds on main: SSH into the
# server, move the tree to the exact commit that passed and rebuild the
# container from deploy/docker-compose.yml.

on:
    workflow_run:
        workflows: [Main checks]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            sha:
                description: Commit SHA to roll out (must be on main)
                required: true

# the job only SSHes out with its own secrets; it needs no GITHUB_TOKEN scopes
permissions: {}

jobs:
    deploy:
        name: Deploy over SSH
        runs-on: ubuntu-latest
        # Environment picked by trigger. A manual "make deploy"
        # (workflow_dispatch) that bypasses CI lands in "production", which
        # requires approval from @alchemmist. The automatic roll-out after a
        # green CI on main (workflow_run) uses "production-auto", which needs no
        # approval. Both environments only allow the main branch and hold the
        # SSH_* secrets, so a modified workflow dispatched from another branch
        # is denied the secrets and can't deploy.
        environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'production-auto' }}
        if: >-
            github.event_name == 'workflow_dispatch'
            || github.event.workflow_run.conclusion == 'success'
        steps:
            - name: Pull and rebuild
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      set -e
                      cd ${{ secrets.SSH_PROJECT_PATH }}
                      git fetch origin main
                      # reset, not checkout: a hand-edit to a tracked file on
                      # the host makes checkout abort and takes the whole
                      # rollout with it. reset leaves untracked files alone, so
                      # the live DB bind-mounted from deploy/data survives.
                      git reset --hard ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
                      cd deploy
                      docker compose up --build -d
