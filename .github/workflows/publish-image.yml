name: Publish Monori images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.front
          push: true
          tags: |
            ghcr.io/alchemmist/monori:front
            ghcr.io/alchemmist/monori:front-${{ github.sha }}
      - name: Deploy front to Socrat
        uses: alchemmist/deploy-to-socrat@v1
        with:
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          image_version: ${{ steps.front.outputs.digest }}
          component: front
      - id: back
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.back
          push: true
          tags: |
            ghcr.io/alchemmist/monori:back
            ghcr.io/alchemmist/monori:back-${{ github.sha }}
      - name: Deploy back to Socrat
        uses: alchemmist/deploy-to-socrat@v1
        with:
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          image_version: ${{ steps.back.outputs.digest }}
          component: back
      - id: sync
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.sync
          push: true
          tags: |
            ghcr.io/alchemmist/monori:sync
            ghcr.io/alchemmist/monori:sync-${{ github.sha }}
      - name: Deploy sync to Socrat
        uses: alchemmist/deploy-to-socrat@v1
        with:
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          image_version: ${{ steps.sync.outputs.digest }}
          component: sync
