# Generated by Quality Graph. Do not edit.
---
name: Quality Graph
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-graph:
    name: Workflow graph validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'
        persist-credentials: 'false'
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: 'web/package-lock.json

          tools/frontend-perf/package-lock.json

          '
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: 'true'
        cache-dependency-glob: uv.lock
    - name: Install project dependencies
      run: scripts/setup-quality-graph.sh
    - run: uv run --locked --group quality-graph qg validate
      name: Run Workflow graph validation
      id: quality-command
      continue-on-error: true
    - name: Collect Workflow graph validation result
      id: quality-result
      if: always()
      uses: alchemmist/quality-graph@a4a65abfc9364da6801be56b992358d302c7ad77
      with:
        operation: collect
        node-id: workflow-graph
        title: Workflow graph validation
        adapter: exit-code
        report-path: ''
        command-outcome: ${{ steps.quality-command.outcome }}
        graph-digest: 3377fcb397b400185976952cb475e66382faea1ea79a4c893459edf5bdb2cd5f
    - name: Upload Workflow graph validation result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-result-workflow-graph-${{ github.run_attempt }}
        path: ${{ runner.temp }}/quality-graph/workflow-graph.json
        if-no-files-found: error
        retention-days: 7
    - name: Enforce Workflow graph validation result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
      run: exit "${EXIT_CODE:-2}"
