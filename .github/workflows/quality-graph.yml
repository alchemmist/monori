# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update qg.yaml and run qg generate.
---
name: Quality Graph
'on':
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-graph:
    name: Workflow graph validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          persist-credentials: 'false'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'web/package.json

            tools/frontend-perf/package.json

            '
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: 'true'
          cache-dependency-glob: 'pyproject.toml

            common/pyproject.toml

            ci/pyproject.toml

            server/pyproject.toml

            '
      - name: Install project dependencies
        run: scripts/setup-quality-graph.sh
      - run: uv run --locked --group quality-graph qg validate
        name: Run Workflow graph validation
        id: quality-command
        continue-on-error: true
      - name: Collect Workflow graph validation result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@f5cef503eaf0734b9c9a0c6f88ee8206b2a6235d
        with:
          operation: collect
          node-id: workflow-graph
          title: Workflow graph validation
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: fd84567c90f332ee7236b23edfa880300026b0c65241fa4021cb6c374e6c0754
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
          flow-id: review
          operation-id: workflow-graph
          presentation: github-pr
      - name: Upload Workflow graph validation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-result-workflow-graph-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/workflow-graph.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Workflow graph validation result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    env:
      QG_FLOW_ID: review
      QG_OPERATION_ID: workflow-graph
      QG_NODE_ID: workflow-graph
      QG_NODE_TITLE: Workflow graph validation
      QG_GRAPH_DIGEST: fd84567c90f332ee7236b23edfa880300026b0c65241fa4021cb6c374e6c0754
