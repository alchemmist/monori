name: PR checks

on:
    issue_comment:
        types: [created]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
    cancel-in-progress: true

jobs:
    workflow-graph:
        name: Workflow graph validation
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Install workflow test dependencies
              run: python -m pip install pyyaml types-PyYAML
            - name: Validate PR workflow graph
              run: python -m unittest scripts.test_pr_workflow scripts.test_main_workflow

    fmt-check:
        name: Format check
        needs: workflow-graph
        if: github.event_name == 'pull_request' && needs.workflow-graph.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - run: make fmt-check

    lint:
        name: Lint
        needs: suppressions
        if: github.event_name == 'pull_request' && needs.suppressions.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - name: Install external linters
              env:
                  HADOLINT_VERSION: "2.12.0"
                  HADOLINT_SHA256: "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010"
                  ACTIONLINT_VERSION: "1.7.7"
                  SHFMT_VERSION: "3.10.0"
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y shellcheck

                  shfmt_bin="shfmt_v${SHFMT_VERSION}_linux_amd64"
                  curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/${shfmt_bin}" -o "${shfmt_bin}"
                  curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/sha256sums.txt" -o shfmt_sha256sums.txt
                  grep " ${shfmt_bin}\$" shfmt_sha256sums.txt | sha256sum -c -
                  sudo install -m 0755 "${shfmt_bin}" /usr/local/bin/shfmt

                  curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" -o hadolint
                  echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
                  sudo install -m 0755 hadolint /usr/local/bin/hadolint

                  tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}" -o "${tarball}"
                  curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o actionlint_checksums.txt
                  grep " ${tarball}\$" actionlint_checksums.txt | sha256sum -c -
                  tar -xzf "${tarball}" actionlint
                  sudo install -m 0755 actionlint /usr/local/bin/actionlint
            - run: make lint

    type:
        name: Type check
        needs: object-annotations
        if: github.event_name == 'pull_request' && needs.object-annotations.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - run: make type

    analyze:
        name: Static analysis
        needs: type
        if: github.event_name == 'pull_request' && needs.type.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - name: Install semgrep
              run: python -m pip install semgrep
            - run: make analyze

    test-fast:
        name: Fast tests
        needs: analyze
        if: github.event_name == 'pull_request' && needs.analyze.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - run: make t-fast

    test-medium:
        name: Medium tests
        needs: test-fast
        if: github.event_name == 'pull_request' && needs.test-fast.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - run: make t-medium

    test-slow:
        name: Slow tests
        needs: test-medium
        if: github.event_name == 'pull_request' && needs.test-medium.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - name: Install Playwright browsers
              run: uv run playwright install --with-deps chromium
              working-directory: server
            - run: make t-slow

    build:
        name: Build
        needs: test-slow
        if: github.event_name == 'pull_request' && needs.test-slow.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - run: make build

    coverage:
        name: Coverage
        needs: build
        if: github.event_name == 'pull_request' && needs.build.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - run: make coverage

    audit-deps:
        name: Dependency audit
        needs: coverage
        if: github.event_name == 'pull_request' && needs.coverage.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - run: make audit-deps

    audit-deps-py:
        name: Python dependency audit
        needs: audit-deps
        if: github.event_name == 'pull_request' && needs.audit-deps.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup-project
            - run: make audit-deps-py

    secrets:
        name: Secret scan
        needs: audit-deps-py
        if: github.event_name == 'pull_request' && needs.audit-deps-py.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Scan for secrets
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    mutation:
        name: Mutation testing
        needs: secrets
        if: github.event_name == 'pull_request' && needs.secrets.result == 'success'
        permissions:
            issues: write
            pull-requests: write
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: ./.github/actions/mutation-diff-gate

    bundle-size:
        name: Frontend bundle size
        needs: secrets
        if: github.event_name == 'pull_request' && needs.secrets.result == 'success'
        permissions:
            actions: write
            contents: read
            issues: write
            pull-requests: write
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1
                  persist-credentials: false
            - uses: ./.github/actions/bundle-size-gate

    frontend-performance-scope:
        name: Frontend performance scope
        needs: secrets
        if: github.event_name == 'pull_request' && needs.secrets.result == 'success'
        permissions:
            actions: write
            contents: read
            issues: write
            pull-requests: write
        runs-on: ubuntu-latest
        outputs:
            relevant: ${{ steps.scope.outputs.relevant }}
        steps:
            - name: Checkout workflow code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - id: scope
              uses: ./.github/actions/frontend-performance-scope

    frontend-performance:
        name: Frontend performance
        needs: [secrets, frontend-performance-scope]
        if: github.event_name == 'pull_request' && needs.secrets.result == 'success' && needs.frontend-performance-scope.result == 'success' && needs.frontend-performance-scope.outputs.relevant == 'true'
        permissions:
            actions: write
            contents: read
            issues: write
            pull-requests: write
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: ./.github/actions/frontend-performance-gate

    frontend-performance-skipped:
        name: Frontend performance skipped
        needs: frontend-performance-scope
        if: github.event_name == 'pull_request' && needs.frontend-performance-scope.result == 'success' && needs.frontend-performance-scope.outputs.relevant == 'false'
        runs-on: ubuntu-latest
        steps:
            - run: echo "Frontend performance skipped because the pull request does not affect performance-relevant files."

    object-annotations:
        name: Python object annotation gate
        needs: lint
        if: github.event_name == 'pull_request' && needs.lint.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: write
            contents: read
            issues: write
            pull-requests: write
        steps:
            - name: Checkout workflow code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/object-annotation-gate
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    suppressions:
        name: Lint suppression gate
        needs: fmt-check
        if: github.event_name == 'pull_request' && needs.fmt-check.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: write
            contents: read
            issues: write
            pull-requests: write
        steps:
            - name: Checkout workflow code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: ./.github/actions/suppression-gate
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    admin-command:
        name: Process CI approval command
        if: >-
            github.event_name == 'issue_comment'
            && github.event.issue.pull_request
            && startsWith(github.event.comment.body, '/')
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: read
            issues: write
            pull-requests: write
        steps:
            - name: Checkout workflow code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Test approval gates
              run: python -m unittest scripts.test_object_annotation_gate scripts.test_suppression_gate
            - name: Apply object and suppression command
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  python scripts/object_annotation_gate.py || true
                  python scripts/suppression_gate.py || true
            - name: Queue bundle and performance command
              uses: actions/github-script@v8
              with:
                  script: |
                      const body = context.payload.comment.body.trim();
                      const match = body.match(/^\/(ignore|ignore-all|remove-ignore)(?:\s+(\S+))?$/);
                      if (!match) return;
                      const args = (match[2] || "").split(",");
                      const targetsBundle = match[1] === "ignore-all" || args.some((id) => id.startsWith("bundle-"));
                      const targetsPerformance = match[1] === "ignore-all" || args.some((id) => id.startsWith("frontend-"));
                      if (!targetsBundle && !targetsPerformance) return;
                      const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        username: context.payload.comment.user.login,
                      });
                      if (permission.data.permission !== "admin") return;
                      const pull = await github.rest.pulls.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.issue.number,
                      });
                      let updated = pull.data.body || "";
                      if (targetsBundle) {
                        const marker = `<!-- monori-bundle-size-pending: ${context.payload.comment.id} -->`;
                        updated = /<!-- monori-bundle-size-pending: \d+ -->/.test(updated)
                          ? updated.replace(/<!-- monori-bundle-size-pending: \d+ -->/, marker)
                          : `${updated.trim()}\n\n${marker}`.trim();
                      }
                      if (targetsPerformance) {
                        const marker = `<!-- monori-frontend-performance-pending: ${context.payload.comment.id} -->`;
                        updated = /<!-- monori-frontend-performance-pending: \d+ -->/.test(updated)
                          ? updated.replace(/<!-- monori-frontend-performance-pending: \d+ -->/, marker)
                          : `${updated.trim()}\n\n${marker}`.trim();
                      }
                      if (updated !== pull.data.body) {
                        await github.rest.pulls.update({ owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, body: updated });
                      }
                      const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        workflow_id: "pr-checks.yaml",
                        event: "pull_request",
                        per_page: 100,
                      });
                      const run = runs.find((item) => item.pull_requests?.some((pullRequest) => pullRequest.number === context.issue.number) && item.status === "completed");
                      if (!run) throw new Error(`No completed pr-checks.yaml run found for PR #${context.issue.number}`);
                      await github.rest.actions.reRunWorkflowFailedJobs({ owner: context.repo.owner, repo: context.repo.repo, run_id: run.id });
