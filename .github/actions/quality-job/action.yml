name: Quality Graph make job
description: Run one make target and publish its detailed Quality Graph result
inputs:
    check-id:
        description: Stable Quality Graph job identifier
        required: true
    title:
        description: Human-readable job title
        required: true
    make-target:
        description: Make target to execute
        required: true
    fix-target:
        description: Optional make target used to produce a formatter diff after failure
        required: false
        default: ""
runs:
    using: composite
    steps:
        - name: Run and publish ${{ inputs.title }}
          id: command
          shell: bash
          env:
              CHECK_ID: ${{ inputs.check-id }}
              CHECK_TITLE: ${{ inputs.title }}
              MAKE_TARGET: ${{ inputs.make-target }}
              FIX_TARGET: ${{ inputs.fix-target }}
          run: >-
              uv run --locked python -m monori.ci.quality_graph.run_job
              --check-id "$CHECK_ID"
              --title "$CHECK_TITLE"
              --make-target "$MAKE_TARGET"
              --fix-target "$FIX_TARGET"
              --log "$RUNNER_TEMP/quality-results/$CHECK_ID.log"
              --diff "$RUNNER_TEMP/quality-results/$CHECK_ID.diff"
              --output "$RUNNER_TEMP/quality-results/$CHECK_ID.json"
              --summary "$GITHUB_STEP_SUMMARY"
        - name: Upload ${{ inputs.title }} result
          if: always()
          uses: actions/upload-artifact@v7
          with:
              name: quality-result-${{ inputs.check-id }}-${{ github.run_attempt }}
              path: ${{ runner.temp }}/quality-results/${{ inputs.check-id }}.json
              if-no-files-found: error
              retention-days: 7
        - name: Enforce ${{ inputs.title }} verdict
          if: always()
          shell: bash
          env:
              EXIT_CODE: ${{ steps.command.outputs.exit_code }}
          run: exit "${EXIT_CODE:-2}"
