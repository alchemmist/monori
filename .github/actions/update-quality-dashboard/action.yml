name: Update Quality Graph dashboard
description: Publish one running or completed job in the live pull-request dashboard
inputs:
    check-id:
        description: Job identifier to mark as in progress
        required: false
        default: ""
    result:
        description: Path to the completed Quality Graph job result
        required: false
        default: ""
runs:
    using: composite
    steps:
        - name: Refresh live Quality Graph status
          if: github.event_name == 'pull_request'
          continue-on-error: true
          shell: bash
          env:
              GITHUB_TOKEN: ${{ github.token }}
              PR_NUMBER: ${{ github.event.pull_request.number }}
              HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              RUN_ID: ${{ github.run_id }}
              RUN_ATTEMPT: ${{ github.run_attempt }}
              CHECK_ID: ${{ inputs.check-id }}
              RESULT_PATH: ${{ inputs.result }}
          run: |
              if [ -n "$CHECK_ID" ]; then
                operation=running
                argument=(--check-id "$CHECK_ID")
              elif [ -n "$RESULT_PATH" ]; then
                operation=update
                argument=(--result "$RESULT_PATH")
              else
                echo 'Either check-id or result must be provided.' >&2
                exit 2
              fi
              uv run --locked python -m monori.ci.quality_graph.dashboard "$operation" \
                --pr-number "$PR_NUMBER" \
                --run-id "$RUN_ID" \
                --run-attempt "$RUN_ATTEMPT" \
                --head-sha "$HEAD_SHA" \
                --run-url "$RUN_URL" \
                "${argument[@]}"
