name: Process CI approval command
description: Apply an administrator command to the pull request quality gates
runs:
    using: composite
    steps:
        - name: Setup Python
          uses: actions/setup-python@v6
          with:
              python-version: "3.12"
        - name: Test approval gates
          shell: bash
          run: python -m unittest scripts.test_object_annotation_gate scripts.test_suppression_gate
        - name: Apply object and suppression command
          continue-on-error: true
          shell: bash
          env:
              GITHUB_TOKEN: ${{ github.token }}
          run: |
              python -m scripts.object_annotation_gate || true
              python -m scripts.suppression_gate || true
        - name: Queue bundle and performance command
          uses: actions/github-script@v8
          with:
              script: |
                  const body = context.payload.comment.body.trim();
                  const match = body.match(/^\/(ignore|ignore-all|remove-ignore)(?:\s+(\S+))?$/);
                  if (!match) return;
                  const args = (match[2] || "").split(",");
                  const targetsBundle = match[1] === "ignore-all" || args.some((id) => id.startsWith("bundle-"));
                  const targetsPerformance = match[1] === "ignore-all" || args.some((id) => id.startsWith("frontend-"));
                  if (!targetsBundle && !targetsPerformance) return;
                  const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    username: context.payload.comment.user.login,
                  });
                  if (permission.data.permission !== "admin") return;
                  const pull = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                  });
                  let updated = pull.data.body || "";
                  if (targetsBundle) {
                    const marker = `<!-- monori-bundle-size-pending: ${context.payload.comment.id} -->`;
                    updated = /<!-- monori-bundle-size-pending: \d+ -->/.test(updated)
                      ? updated.replace(/<!-- monori-bundle-size-pending: \d+ -->/, marker)
                      : `${updated.trim()}\n\n${marker}`.trim();
                  }
                  if (targetsPerformance) {
                    const marker = `<!-- monori-frontend-performance-pending: ${context.payload.comment.id} -->`;
                    updated = /<!-- monori-frontend-performance-pending: \d+ -->/.test(updated)
                      ? updated.replace(/<!-- monori-frontend-performance-pending: \d+ -->/, marker)
                      : `${updated.trim()}\n\n${marker}`.trim();
                  }
                  if (updated !== pull.data.body) {
                    await github.rest.pulls.update({ owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, body: updated });
                  }
                  const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: "pr-checks.yaml",
                    event: "pull_request",
                    per_page: 100,
                  });
                  const run = runs.find((item) => item.pull_requests?.some((pullRequest) => pullRequest.number === context.issue.number) && item.status === "completed");
                  if (!run) throw new Error(`No completed pr-checks.yaml run found for PR #${context.issue.number}`);
                  await github.rest.actions.reRunWorkflowFailedJobs({ owner: context.repo.owner, repo: context.repo.repo, run_id: run.id });
