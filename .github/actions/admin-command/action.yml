name: Process Quality Graph command
description: Apply an administrator command to the pull request Quality Graph
runs:
    using: composite
    steps:
        - name: Setup Python dependencies
          uses: ./.github/actions/setup-project
          with:
              python-profile: ci
        - name: Test Quality Graph command API
          shell: bash
          run: >-
              uv run --locked python -m unittest
              monori.ci.tests.test_commands
              monori.ci.tests.test_quality_check_lifecycle
        - name: Process Quality Graph command
          shell: bash
          env:
              GITHUB_TOKEN: ${{ github.token }}
          run: uv run --locked python -m monori.ci.quality_graph.commands
