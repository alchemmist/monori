name: Mutation diff gate
description: Run frontend and Python mutation checks for the pull request diff
runs:
    using: composite
    steps:
        - name: Prepare mutation report
          shell: bash
          run: |
              mutation_summary_path="$RUNNER_TEMP/mutation/summary.md"
              echo "MUTATION_SUMMARY_PATH=$mutation_summary_path" >> "$GITHUB_ENV"
              mkdir -p "$(dirname "$mutation_summary_path")"
              : > "$mutation_summary_path"
        - name: Fetch mutation base
          shell: bash
          run: git fetch --no-tags origin main
        - name: Setup project dependencies
          uses: ./.github/actions/setup-project
          with:
              install-web: true
              python-profile: mutation
        - name: Restore Stryker cache
          uses: actions/cache@v4
          with:
              path: web/reports/stryker-incremental.json
              key: mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
              restore-keys: |
                  mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-pr-${{ github.event.pull_request.number }}-
                  mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-main-
        - name: Test diff mutation gate
          id: mutation-test
          shell: bash
          run: env -u GITHUB_STEP_SUMMARY uv run --locked pytest -q ci/tests/test_mutation_diff_gate.py
        - name: Run frontend diff mutation tests
          id: mutation-front
          continue-on-error: true
          shell: bash
          run: make BASE=origin/main MUTATION_DIFF_THRESHOLD=90 m-front-diff
        - name: Run backend diff mutation tests
          id: mutation-back
          continue-on-error: true
          shell: bash
          run: make BASE=origin/main MUTATION_DIFF_THRESHOLD=90 m-back-diff
        - name: Publish mutation summary
          if: always()
          shell: bash
          run: |
              if [ ! -s "$MUTATION_SUMMARY_PATH" ]; then
                printf '%s\n' 'No mutation report was produced.' > "$MUTATION_SUMMARY_PATH"
              fi
              status=failed
              if [ "${{ steps.mutation-test.outcome }}" = success ] && [ "${{ steps.mutation-front.outcome }}" = success ] && [ "${{ steps.mutation-back.outcome }}" = success ]; then
                status=passed
              fi
              uv run --locked python -m monori.ci.quality_graph.result_cli \
                --check-id mutation \
                --title 'Mutation testing' \
                --status "$status" \
                --summary "$MUTATION_SUMMARY_PATH" \
                --output "$RUNNER_TEMP/quality-results/mutation.json"
        - name: Upload mutation result
          if: always()
          uses: actions/upload-artifact@v7
          with:
              name: quality-result-mutation-${{ github.run_attempt }}
              path: ${{ runner.temp }}/quality-results/mutation.json
              if-no-files-found: error
              retention-days: 7
        - name: Fail if a mutation gate failed
          if: always() && (steps.mutation-test.outcome != 'success' || steps.mutation-front.outcome != 'success' || steps.mutation-back.outcome != 'success')
          shell: bash
          run: exit 1
