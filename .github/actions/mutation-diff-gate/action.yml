name: Mutation diff gate
description: Run frontend and backend mutation checks for the pull request diff
runs:
    using: composite
    steps:
        - name: Prepare mutation report
          shell: bash
          run: |
              mutation_summary_path="$RUNNER_TEMP/mutation/summary.md"
              echo "MUTATION_SUMMARY_PATH=$mutation_summary_path" >> "$GITHUB_ENV"
              mkdir -p "$(dirname "$mutation_summary_path")"
              : > "$mutation_summary_path"
        - name: Fetch mutation base
          shell: bash
          run: git fetch --no-tags origin main
        - name: Setup Node
          uses: actions/setup-node@v7
          with:
              node-version: 22
              cache: npm
              cache-dependency-path: web/package-lock.json
        - name: Setup uv
          uses: astral-sh/setup-uv@v7
          with:
              enable-cache: true
        - name: Install web deps
          shell: bash
          run: npm ci --no-audit --no-fund
          working-directory: web
        - name: Install server deps
          shell: bash
          run: uv sync
          working-directory: server
        - name: Restore Stryker cache
          uses: actions/cache@v4
          with:
              path: web/reports/stryker-incremental.json
              key: mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
              restore-keys: |
                  mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-pr-${{ github.event.pull_request.number }}-
                  mutation-stryker-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-main-
        - name: Restore mutmut cache
          uses: actions/cache/restore@v4
          with:
              path: server/mutants
              key: mutation-mutmut-${{ runner.os }}-${{ hashFiles('server/pyproject.toml') }}-main-
              restore-keys: mutation-mutmut-${{ runner.os }}-${{ hashFiles('server/pyproject.toml') }}-main-
        - name: Test diff mutation gate
          shell: bash
          run: env -u GITHUB_STEP_SUMMARY python3 -m unittest scripts/test_mutation_diff_gate.py
        - name: Run frontend diff mutation tests
          id: mutation-front
          continue-on-error: true
          shell: bash
          run: make BASE=origin/main MUTATION_DIFF_THRESHOLD=90 m-front-diff
        - name: Run backend diff mutation tests
          id: mutation-back
          continue-on-error: true
          shell: bash
          run: make BASE=origin/main MUTATION_DIFF_THRESHOLD=90 m-back-diff
        - name: Publish mutation report
          if: always()
          shell: bash
          env:
              GITHUB_TOKEN: ${{ github.token }}
              GITHUB_REPOSITORY: ${{ github.repository }}
              PR_NUMBER: ${{ github.event.pull_request.number }}
          run: |
              if [ ! -s "$MUTATION_SUMMARY_PATH" ]; then
                printf '%s\n' '## Mutation testing' '' 'No mutation report was produced.' > "$MUTATION_SUMMARY_PATH"
              fi
              python -m scripts.pr_comment \
                --marker mutation \
                --body-file "$MUTATION_SUMMARY_PATH" \
                --pr-number "$PR_NUMBER"
        - name: Fail if a mutation gate failed
          if: steps.mutation-front.outcome == 'failure' || steps.mutation-back.outcome == 'failure'
          shell: bash
          run: exit 1
