name: Hardcoded color gate
description: Check added web color literals and publish the gate report
inputs:
    github-token:
        description: GitHub token used to publish the gate report
        required: true
runs:
    using: composite
    steps:
        - name: Setup Python dependencies
          uses: ./.github/actions/setup-project
          with:
              python-profile: ci
        - name: Test hardcoded color checker
          id: hardcoded-color-test
          shell: bash
          run: |
              set +e
              log_path="$RUNNER_TEMP/quality-results/hardcoded-color-test.log"
              mkdir -p "$(dirname "$log_path")"
              env -u GITHUB_STEP_SUMMARY -u MUTATION_SUMMARY_PATH uv run --locked pytest -q ci/tests/test_hardcoded_colors.py 2>&1 | tee "$log_path"
              echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
              exit 0
        - name: Check hardcoded colors
          id: hardcoded-colors
          if: steps.hardcoded-color-test.outputs.exit_code == '0'
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
              QUALITY_RESULT_PATH: ${{ runner.temp }}/quality-results/hardcoded-colors.json
          run: |
              set +e
              uv run --locked python -m monori.ci.quality_graph.checks.hardcoded_colors
              echo "exit_code=$?" >> "$GITHUB_OUTPUT"
              exit 0
        - name: Publish failed checker test summary
          if: steps.hardcoded-color-test.outputs.exit_code != '0'
          shell: bash
          run: >-
              uv run --locked python -m monori.ci.quality_graph.job_report
              --check-id hardcoded-colors
              --title 'Hardcoded color gate'
              --exit-code "${{ steps.hardcoded-color-test.outputs.exit_code }}"
              --log "$RUNNER_TEMP/quality-results/hardcoded-color-test.log"
              --output "$RUNNER_TEMP/quality-results/hardcoded-colors.json"
              --summary "$GITHUB_STEP_SUMMARY"
        - name: Upload hardcoded-color result
          if: always()
          uses: actions/upload-artifact@v7
          with:
              name: quality-result-hardcoded-colors-${{ github.run_attempt }}
              path: ${{ runner.temp }}/quality-results/hardcoded-colors.json
              if-no-files-found: error
              retention-days: 7
        - name: Enforce hardcoded-color verdict
          if: always()
          shell: bash
          env:
              TEST_EXIT: ${{ steps.hardcoded-color-test.outputs.exit_code }}
              CHECK_EXIT: ${{ steps.hardcoded-colors.outputs.exit_code }}
          run: |
              if [ "${TEST_EXIT:-2}" -ne 0 ]; then
                exit "${TEST_EXIT:-2}"
              fi
              exit "${CHECK_EXIT:-2}"
