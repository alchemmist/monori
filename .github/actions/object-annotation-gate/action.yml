name: Python object annotation gate
description: Check changed Python annotations and publish the gate report
inputs:
    github-token:
        description: GitHub token used to publish the gate report
        required: true
runs:
    using: composite
    steps:
        - name: Setup Python
          uses: actions/setup-python@v6
          with:
              python-version: "3.12"
        - name: Test annotation checker
          shell: bash
          run: python -m unittest discover -s ci/tests -p 'test_object_annotations.py'
        - name: Check Python annotations
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
          run: python -m ci.quality_graph.checks.object_annotations
