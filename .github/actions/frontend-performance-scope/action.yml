name: Frontend performance scope
description: Detect performance-relevant pull request changes and publish the scope report
outputs:
    relevant:
        description: Whether the pull request changes frontend performance-relevant files
        value: ${{ steps.scope.outputs.relevant }}
runs:
    using: composite
    steps:
        - name: Setup Python dependencies
          uses: ./.github/actions/setup-project
          with:
              python-profile: ci
        - name: Detect performance-relevant changes
          id: scope
          uses: actions/github-script@v8
          with:
              script: |
                  const files = await github.paginate(github.rest.pulls.listFiles, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.pull_request.number,
                    per_page: 100,
                  });
                  const relevantPrefixes = [
                    "web/",
                    "tools/frontend-perf/",
                    ".github/actions/frontend-performance",
                  ];
                  const relevantPaths = new Set([
                    "deploy/docker-compose.test.yml",
                    "deploy/Dockerfile.front",
                    "deploy/nginx.conf",
                    ".dockerignore",
                    "scripts/frontend-perf.sh",
                    "ci/quality_graph/checks/frontend_performance.py",
                    "ci/quality_graph/checks/frontend_measurement.py",
                    "ci/tests/test_frontend_performance.py",
                    "ci/tests/test_frontend_measurement.py",
                    ".github/workflows/pr-checks.yaml",
                  ]);
                  const relevant = files.some((file) => {
                    const path = file.filename;
                    if (relevantPrefixes.some((prefix) => path.startsWith(prefix))) return true;
                    if (relevantPaths.has(path)) return true;
                    if (path !== "Makefile") return false;
                    if (file.patch === undefined) return true;
                    return /(perf-front|PERF_|frontend)/i.test(file.patch);
                  });
                  core.setOutput("relevant", relevant ? "true" : "false");
        - name: Publish failed performance scope summary
          if: always() && steps.scope.outcome == 'failure'
          shell: bash
          run: >-
              uv run --locked python -m monori.ci.quality_graph.result_cli
              --check-id frontend-performance
              --title 'Frontend performance'
              --status failed
              --message 'Could not determine frontend performance scope.'
              --job-summary "$GITHUB_STEP_SUMMARY"
              --output "$RUNNER_TEMP/quality-results/frontend-performance.json"
        - name: Publish skipped performance summary
          if: steps.scope.outcome == 'success' && steps.scope.outputs.relevant != 'true'
          shell: bash
          run: >-
              uv run --locked python -m monori.ci.quality_graph.result_cli
              --check-id frontend-performance
              --title 'Frontend performance'
              --status skipped
              --message 'No performance-relevant files changed; the gate is not applicable.'
              --job-summary "$GITHUB_STEP_SUMMARY"
              --output "$RUNNER_TEMP/quality-results/frontend-performance.json"
        - name: Upload frontend-performance scope result
          if: always() && steps.scope.outputs.relevant != 'true'
          uses: actions/upload-artifact@v7
          with:
              name: quality-result-frontend-performance-${{ github.run_attempt }}
              path: ${{ runner.temp }}/quality-results/frontend-performance.json
              if-no-files-found: error
              retention-days: 7
