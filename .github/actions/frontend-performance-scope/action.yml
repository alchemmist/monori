name: Frontend performance scope
description: Detect performance-relevant pull request changes and publish the scope report
outputs:
    relevant:
        description: Whether the pull request changes frontend performance-relevant files
        value: ${{ steps.scope.outputs.relevant }}
runs:
    using: composite
    steps:
        - name: Setup Python dependencies
          uses: ./.github/actions/setup-project
          with:
              install-python: true
        - name: Detect performance-relevant changes
          id: scope
          uses: actions/github-script@v8
          with:
              script: |
                  const files = await github.paginate(github.rest.pulls.listFiles, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.pull_request.number,
                    per_page: 100,
                  });
                  const relevantPrefixes = [
                    "web/",
                    "tools/frontend-perf/",
                    ".github/actions/frontend-performance",
                  ];
                  const relevantPaths = new Set([
                    "deploy/docker-compose.test.yml",
                    "deploy/Dockerfile.front",
                    "deploy/nginx.conf",
                    ".dockerignore",
                    "scripts/frontend-perf.sh",
                    "ci/quality_graph/checks/frontend_performance.py",
                    "ci/quality_graph/checks/frontend_measurement.py",
                    "ci/tests/test_frontend_performance.py",
                    "ci/tests/test_frontend_measurement.py",
                    ".github/workflows/pr-checks.yaml",
                  ]);
                  const relevant = files.some((file) => {
                    const path = file.filename;
                    if (relevantPrefixes.some((prefix) => path.startsWith(prefix))) return true;
                    if (relevantPaths.has(path)) return true;
                    if (path !== "Makefile") return false;
                    if (file.patch === undefined) return true;
                    return /(perf-front|PERF_|frontend)/i.test(file.patch);
                  });
                  core.setOutput("relevant", relevant ? "true" : "false");
        - name: Publish performance scope report
          if: steps.scope.outcome == 'success'
          shell: bash
          env:
              GITHUB_TOKEN: ${{ github.token }}
              GITHUB_REPOSITORY: ${{ github.repository }}
              PR_NUMBER: ${{ github.event.pull_request.number }}
              RELEVANT: ${{ steps.scope.outputs.relevant }}
          run: |
              if [ "$RELEVANT" = true ]; then
                printf '%s\n' '## ⏳ Frontend performance' '' 'Performance-relevant files changed; running the gate.' > "$RUNNER_TEMP/frontend-performance-scope.md"
              else
                printf '%s\n' '## ✅ Frontend performance' '' 'No performance-relevant files changed; the gate is skipped.' > "$RUNNER_TEMP/frontend-performance-scope.md"
              fi
              uv run --locked python -m ci.lib.comments \
                --marker frontend-performance \
                --body-file "$RUNNER_TEMP/frontend-performance-scope.md" \
                --pr-number "$PR_NUMBER"
