name: Lint suppression gate
description: Check changed lint suppressions and publish the gate report
inputs:
    github-token:
        description: GitHub token used to publish the gate report
        required: true
runs:
    using: composite
    steps:
        - name: Setup Python dependencies
          uses: ./.github/actions/setup-project
          with:
              python-profile: ci
        - name: Test suppression checker
          id: suppression-test
          shell: bash
          run: |
              set +e
              log_path="$RUNNER_TEMP/quality-results/suppression-test.log"
              mkdir -p "$(dirname "$log_path")"
              env -u GITHUB_STEP_SUMMARY -u MUTATION_SUMMARY_PATH uv run --locked pytest -q ci/tests/test_suppressions.py 2>&1 | tee "$log_path"
              echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
              exit 0
        - name: Check lint suppressions
          id: suppressions
          if: steps.suppression-test.outputs.exit_code == '0'
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
              QUALITY_RESULT_PATH: ${{ runner.temp }}/quality-results/suppressions.json
          run: |
              set +e
              uv run --locked python -m monori.ci.quality_graph.checks.suppressions
              echo "exit_code=$?" >> "$GITHUB_OUTPUT"
              exit 0
        - name: Publish failed suppression test summary
          if: steps.suppression-test.outputs.exit_code != '0'
          shell: bash
          run: >-
              uv run --locked python -m monori.ci.quality_graph.job_report
              --check-id suppressions
              --title 'Lint suppression gate'
              --exit-code "${{ steps.suppression-test.outputs.exit_code }}"
              --log "$RUNNER_TEMP/quality-results/suppression-test.log"
              --output "$RUNNER_TEMP/quality-results/suppressions.json"
              --summary "$GITHUB_STEP_SUMMARY"
        - name: Upload lint-suppression result
          if: always()
          uses: actions/upload-artifact@v7
          with:
              name: quality-result-suppressions-${{ github.run_attempt }}
              path: ${{ runner.temp }}/quality-results/suppressions.json
              if-no-files-found: error
              retention-days: 7
        - name: Enforce lint-suppression verdict
          if: always()
          shell: bash
          env:
              TEST_EXIT: ${{ steps.suppression-test.outputs.exit_code }}
              CHECK_EXIT: ${{ steps.suppressions.outputs.exit_code }}
          run: |
              if [ "${TEST_EXIT:-2}" -ne 0 ]; then
                exit "${TEST_EXIT:-2}"
              fi
              exit "${CHECK_EXIT:-2}"
