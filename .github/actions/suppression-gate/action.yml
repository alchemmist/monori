name: Lint suppression gate
description: Check changed lint suppressions and publish the gate report
inputs:
    github-token:
        description: GitHub token used to publish the gate report
        required: true
runs:
    using: composite
    steps:
        - name: Setup Python dependencies
          uses: ./.github/actions/setup-project
          with:
              python-profile: ci
        - uses: ./.github/actions/report-in-progress
          with:
              marker: suppression
              github-token: ${{ inputs.github-token }}
        - name: Test suppression checker
          id: suppression-test
          shell: bash
          run: uv run --locked python -m unittest discover -s ci/tests -p 'test_suppressions.py'
        - name: Check lint suppressions
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
          run: uv run --locked python -m monori.ci.quality_graph.checks.suppressions
        - name: Publish failed suppression test report
          if: always() && steps.suppression-test.outcome == 'failure'
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
              PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          run: >-
              uv run --locked python -m monori.ci.quality_graph.reporting complete
              --marker suppression
              --status fail
              --message 'The suppression checker tests failed.'
              --pr-number "$PR_NUMBER"
