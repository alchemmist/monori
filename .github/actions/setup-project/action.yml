name: Setup project
description: Install only the project dependencies required by the current job
inputs:
    install-web:
        description: Install web dependencies and configure Node
        required: false
        default: "false"
    install-python:
        description: Install shared Python dependencies and configure uv
        required: false
        default: "false"
    install-server:
        description: Deprecated alias for install-python
        required: false
        default: "false"
runs:
    using: composite
    steps:
        - name: Setup Node
          if: inputs.install-web == 'true'
          uses: actions/setup-node@v7
          with:
              node-version: 22
              cache: npm
              cache-dependency-path: web/package-lock.json

        - name: Pin npm
          if: inputs.install-web == 'true'
          shell: bash
          run: npm install --global npm@10.9.2

        - name: Setup uv
          if: inputs.install-python == 'true' || inputs.install-server == 'true'
          uses: astral-sh/setup-uv@v7
          with:
              enable-cache: true
              cache-dependency-glob: uv.lock

        - name: Restore Python environment
          if: inputs.install-python == 'true' || inputs.install-server == 'true'
          uses: actions/cache@v4
          with:
              path: .venv
              key: uv-venv-${{ runner.os }}-python-3.12-${{ hashFiles('uv.lock') }}

        - name: Install web dependencies
          if: inputs.install-web == 'true'
          shell: bash
          run: npm ci --no-audit --no-fund
          working-directory: web

        - name: Install server dependencies
          if: inputs.install-python == 'true' || inputs.install-server == 'true'
          shell: bash
          run: uv sync --locked --all-packages --group dev
          working-directory: .
