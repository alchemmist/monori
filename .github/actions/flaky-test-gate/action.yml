name: Flaky test detection
description: Repeat newly added product tests and publish sticky Quality Graph findings
inputs:
    github-token:
        description: GitHub token used to persist evidence and approvals
        required: true
runs:
    using: composite
    steps:
        - name: Setup test dependencies
          uses: ./.github/actions/setup-project
          with:
              install-web: true
              python-profile: test
        - name: Discover newly added tests
          id: discovery
          shell: bash
          env:
              BASE_SHA: ${{ github.event.pull_request.base.sha }}
          run: |
              set +e
              log_path="$RUNNER_TEMP/quality-results/flaky-tests-discovery.log"
              mkdir -p "$(dirname "$log_path")"
              uv run --locked python -m monori.ci.lib.flaky_tests \
                  --base "$BASE_SHA" \
                  --manifest "$RUNNER_TEMP/quality-results/flaky-tests-manifest.json" \
                  --github-output "$GITHUB_OUTPUT" 2>&1 | tee "$log_path"
              echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
              exit 0
        - name: Install Playwright browser
          if: steps.discovery.outputs.exit_code == '0' && steps.discovery.outputs.has_slow == 'true'
          shell: bash
          working-directory: web
          run: npx playwright install --with-deps chromium
        - name: Start end-to-end stack
          id: e2e-stack
          if: steps.discovery.outputs.exit_code == '0' && steps.discovery.outputs.has_slow == 'true'
          shell: bash
          env:
              CONTAINER_PLATFORM: linux/amd64
              E2E_PORT: "8078"
          run: |
              set +e
              log_path="$RUNNER_TEMP/quality-results/flaky-tests-e2e-stack.log"
              docker compose -f deploy/docker-compose.test.yml -p monori-flaky up --build --detach 2>&1 | tee "$log_path"
              stack_exit=${PIPESTATUS[0]}
              if [ "$stack_exit" -ne 0 ]; then
                  echo "exit_code=$stack_exit" >> "$GITHUB_OUTPUT"
                  exit 0
              fi
              for attempt in $(seq 1 120); do
                  if curl -fsS --connect-timeout 1 --max-time 2 http://localhost:8078/openapi.json >/dev/null; then
                      echo "exit_code=0" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  sleep 1
              done
              docker compose -f deploy/docker-compose.test.yml -p monori-flaky logs 2>&1 | tee -a "$log_path"
              echo "exit_code=1" >> "$GITHUB_OUTPUT"
              exit 0
        - name: Repeat newly added tests
          id: check
          if: >-
              steps.discovery.outputs.exit_code == '0'
              && (
                steps.discovery.outputs.has_slow != 'true'
                || steps.e2e-stack.outputs.exit_code == '0'
              )
          shell: bash
          env:
              E2E_BASE_URL: http://localhost:8078
              GITHUB_TOKEN: ${{ inputs.github-token }}
              QUALITY_RESULT_PATH: ${{ runner.temp }}/quality-results/flaky-tests.json
              RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          run: |
              set +e
              uv run --locked python -m monori.ci.quality_graph.checks.flaky_tests \
                  --manifest "$RUNNER_TEMP/quality-results/flaky-tests-manifest.json"
              echo "exit_code=$?" >> "$GITHUB_OUTPUT"
              exit 0
        - name: Stop end-to-end stack
          if: always() && steps.discovery.outputs.has_slow == 'true'
          shell: bash
          run: docker compose -f deploy/docker-compose.test.yml -p monori-flaky down --volumes --remove-orphans
        - name: Publish discovery failure
          if: steps.discovery.outputs.exit_code != '0'
          shell: bash
          run: >-
              uv run --locked python -m monori.ci.quality_graph.job_report
              --check-id flaky-tests
              --title 'Flaky test detection'
              --exit-code "${{ steps.discovery.outputs.exit_code }}"
              --log "$RUNNER_TEMP/quality-results/flaky-tests-discovery.log"
              --output "$RUNNER_TEMP/quality-results/flaky-tests.json"
              --summary "$GITHUB_STEP_SUMMARY"
        - name: Publish end-to-end stack failure
          if: >-
              steps.discovery.outputs.exit_code == '0'
              && steps.discovery.outputs.has_slow == 'true'
              && steps.e2e-stack.outputs.exit_code != '0'
          shell: bash
          run: >-
              uv run --locked python -m monori.ci.quality_graph.job_report
              --check-id flaky-tests
              --title 'Flaky test detection'
              --exit-code "${{ steps.e2e-stack.outputs.exit_code }}"
              --log "$RUNNER_TEMP/quality-results/flaky-tests-e2e-stack.log"
              --output "$RUNNER_TEMP/quality-results/flaky-tests.json"
              --summary "$GITHUB_STEP_SUMMARY"
        - name: Upload flaky-test result
          if: always()
          uses: actions/upload-artifact@v7
          with:
              name: quality-result-flaky-tests-${{ github.run_attempt }}
              path: ${{ runner.temp }}/quality-results/flaky-tests.json
              if-no-files-found: error
              retention-days: 7
        - name: Enforce flaky-test verdict
          if: always()
          shell: bash
          env:
              DISCOVERY_EXIT: ${{ steps.discovery.outputs.exit_code }}
              STACK_EXIT: ${{ steps.e2e-stack.outputs.exit_code }}
              HAS_SLOW: ${{ steps.discovery.outputs.has_slow }}
              CHECK_EXIT: ${{ steps.check.outputs.exit_code }}
          run: |
              if [ "${DISCOVERY_EXIT:-2}" -ne 0 ]; then
                  exit "${DISCOVERY_EXIT:-2}"
              fi
              if [ "$HAS_SLOW" = 'true' ] && [ "${STACK_EXIT:-2}" -ne 0 ]; then
                  exit "${STACK_EXIT:-2}"
              fi
              exit "${CHECK_EXIT:-2}"
