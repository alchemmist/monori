[project]
name = "monori-server"
version = "0.1.0"
description = "Monori personal budget server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "cryptography>=44",
  "pyjwt>=2.9",
  "argon2-cffi>=23",
  "python-multipart>=0.0.9",
  "alembic>=1.18.5",
  "httpx[socks]>=0.27",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
connectors = ["playwright>=1.40"]
