[project]
name = "monori-server"
version = "0.1.0"
description = "Monori personal budget server"
requires-python = ">=3.12"
dependencies = [
  "monori-common",
  "fastapi>=0.115",
  "httpx[socks]>=0.27",
  "uvicorn[standard]>=0.30",
  "cryptography>=50",
  "pyjwt>=2.9",
  "argon2-cffi>=23",
  "python-multipart>=0.0.9",
  "alembic>=1.18.5",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
connectors = ["playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
monori-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/monori"]
