[project]
name = "monori-server"
version = "0.1.0"
description = "Monori personal budget server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=44",
    "pyjwt>=2.9",
    "argon2-cffi>=23",
    "python-multipart>=0.0.9",
    "alembic>=1.18.5", "httpx[socks]>=0.27", "openpyxl>=3.1",
]

[project.optional-dependencies]
connectors = [
    "playwright>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.14",
    "mypy>=1.13",
    "bandit>=1.8",
    "vulture>=2.16",
    "httpx2>=2.5.0",
    "mutmut>=3.6.0",
    "pip-audit>=2.10.1",
    "types-openpyxl>=3.1.5.20260724",
    "google-api-python-client>=2.0",
    "google-api-python-client-stubs>=1.39.0",
    "google-auth>=2.0",
    "google-auth-stubs>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration test that stands up real dependencies",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["server"]
exclude = ["web/prototypes"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter-owned or formatter-incompatible rules.
    "COM812",
    "E501",
    "D205",
    "D401",
    # Ruff enables both sides of these mutually exclusive docstring pairs.
    "D203",
    "D213",

    # Existing public API and test naming conventions.
    "A002",
    "ARG001",
    "ARG002",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "FBT001",
    "FBT002",
    "FBT003",
    "N803",
    "N813",
    "N814",
    "N815",
    "N818",
    "INP001",

    # Intentional complexity and values in application/test orchestration.
    "C901",
    "DTZ001",
    "DTZ005",
    "PERF401",
    "PERF403",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLW0603",
    "PLW2901",
    "PT012",
    "PT017",
    "PTH113",
    "PTH118",
    "RUF001",
    "RUF003",
    "RUF012",
    "RUF043",
    "S101",
    "S105",
    "S106",
    "S107",
    "S608",
    "SLF001",
    "TRY004",
    "TRY300",
    "TRY301",

    # Required lazy imports and compatibility paths.
    "PLC0415",
    "TID252",
]

[tool.mypy]
python_version = "3.12"
files = ["app"]
exclude = ['(^|/)mutants/']
strict = true
warn_unreachable = true
extra_checks = true
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
warn_return_any = true
enable_error_code = [
    "explicit-override",
    "mutable-override",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "redundant-expr",
    "unused-awaitable",
    "ignore-without-code",
]

[tool.bandit]
exclude_dirs = ["tests"]
# B105 flags string literals whose variable name looks password-like. It only
# false-positives here (CSS selectors, a fake session marker); real credentials
# are user-supplied and encrypted, never hardcoded.
skips = ["B105"]

[tool.vulture]
paths = ["app"]
min_confidence = 80
# These names are required by Playwright-compatible protocol signatures even
# when the local adapter does not use the callback arguments.
ignore_names = ["referer", "predicate"]
