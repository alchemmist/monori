[project]
name = "monori"
version = "0.1.0"
description = "Monori"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.sources]
monori-ci = { workspace = true }
monori-server = { workspace = true }

[tool.uv.workspace]
members = ["common", "ci", "server"]

[dependency-groups]
format = ["monori-ci", "ruff==0.15.22"]
ci = ["monori-ci", "pytest>=8"]
quality-graph = [
  "quality-graph-cli==0.1.8",
  "quality-graph-github==0.1.8",
  "quality-graph-python==0.1.8",
]
lint = ["monori-ci", "ruff==0.15.22"]
test = [
  "monori-ci",
  "monori-server[connectors]",
  "httpx2>=0.1",
  "pytest>=8",
  "pytest-cov>=5",
  "diff-cover>=10.4.1",
]
type = [
  "monori-ci",
  "monori-server[connectors]",
  "mypy>=1.13",
  "types-openpyxl>=3.1.5.20260724",
  "types-PyYAML>=6.0.12.20250516",
  "PyYAML>=6.0",
  "google-api-python-client>=2.0",
  "google-api-python-client-stubs>=1.39.0",
  "google-auth>=2.0",
  "google-auth-stubs>=0.2",
  "httpx2>=0.1",
  "pytest>=8",
]
analyze = [
  "bandit>=1.8",
  "monori-ci",
  "vulture>=2.16",
]
audit = ["monori-ci", "pip-audit>=2.10.1"]
mutation = [
  { include-group = "test" },
  "mutmut>=3.6.0",
]
runtime = ["monori-server"]
sync-runtime = ["monori-server[connectors]"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "ci/tests"]
markers = ["integration: integration test that stands up real dependencies"]

[tool.coverage.run]
source = ["common", "ci", "server"]
omit = ["*/tests/*", "**/mutants/**"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["common", "ci", "server"]
exclude = ["web/prototypes", "**/mutants/**"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D200", "D203", "D212"]

[tool.ruff.lint.isort]
known-first-party = ["monori"]

[tool.ruff.lint.per-file-ignores]
"server/tests/**/*.py" = [
  "D102", "D103", "PLR2004", "S101", "D101", "S106", "S107",
  "D100", "S105", "D107", "D105", "D104", "F401"
]
"ci/tests/**/*.py" = [
  "D102", "D103", "PLR2004", "S101", "D101", "S106", "S107",
  "D100", "S105", "D107", "D105", "D104", "F401"
]
"server/migrations/**/*.py" = ["S101", "INP001"]
"server/app/workbook/parser.py" = ["RUF001"]
"server/app/connectors/tbank_playwright.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
packages = ["monori.common", "monori.ci", "monori.server"]
exclude = ['(^|/)mutants/']
strict = true
warn_unreachable = true
extra_checks = true
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
warn_return_any = true
enable_error_code = [
  "explicit-override", "mutable-override", "truthy-bool", "truthy-iterable",
  "possibly-undefined", "redundant-expr", "unused-awaitable", "ignore-without-code"
]

[tool.bandit]
exclude_dirs = ["server/tests", "ci/tests", "**/.venv/**", "**/build/**", "**/mutants/**"]
skips = ["B105"]

[tool.vulture]
paths = ["common", "ci", "server"]
exclude = ["*/.venv/*", "*/build/*", "*/mutants/*"]
min_confidence = 80
ignore_names = ["referer", "predicate", "user_data_dir", "user_agent", "accept_downloads"]

[tool.mutmut]
source_paths = [
  "monori/server/app",
  "monori/ci/lib",
  "monori/ci/quality_graph",
  "monori/common",
]
do_not_mutate = ["*ci/quality_graph/checks/type_casts.py"]
also_copy = [
  ".github",
  "scripts",
  "Makefile",
  "server/tests",
  "ci/tests",
  "performance",
  "tools/frontend-perf",
  "monori/server/schema.sql",
  "monori/server/migrations",
]
pytest_add_cli_args_test_selection = [
  "--import-mode=importlib",
  "-m",
  "not integration",
  "server/tests",
  "ci/tests",
]
