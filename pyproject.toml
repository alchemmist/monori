[project]
name = "monori-workspace"
version = "0.1.0"
description = "Monori Python workspace"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "fastapi>=0.115",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff==0.15.22",
  "mypy>=1.13",
  "bandit>=1.8",
  "vulture>=2.16",
  "httpx[socks]>=0.27",
  "mutmut>=3.6.0",
  "pip-audit>=2.10.1",
  "types-openpyxl>=3.1.5.20260724",
  "types-PyYAML>=6.0.12.20250516",
  "PyYAML>=6.0",
  "google-api-python-client>=2.0",
  "google-api-python-client-stubs>=1.39.0",
  "google-auth>=2.0",
  "google-auth-stubs>=0.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "ci"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "ci/tests"]
markers = ["integration: integration test that stands up real dependencies"]

[tool.coverage.run]
source = ["server/app", "ci"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["server", "ci"]
exclude = ["web/prototypes"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"server/tests/**/*.py" = [
  "D102", "D103", "PLR2004", "S101", "D101", "S106", "S107",
  "D100", "S105", "D107", "D105", "D104", "F401"
]
"ci/tests/**/*.py" = [
  "D102", "D103", "PLR2004", "S101", "D101", "S106", "S107",
  "D100", "S105", "D107", "D105", "D104", "F401"
]
"server/migrations/**/*.py" = ["S101", "INP001"]
"server/app/workbook/parser.py" = ["RUF001"]
"server/app/connectors/tbank_playwright.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["server/app", "ci"]
exclude = ['(^|/)mutants/']
strict = true
warn_unreachable = true
extra_checks = true
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
warn_return_any = true
enable_error_code = [
  "explicit-override", "mutable-override", "truthy-bool", "truthy-iterable",
  "possibly-undefined", "redundant-expr", "unused-awaitable", "ignore-without-code"
]

[tool.bandit]
exclude_dirs = ["server/tests", "ci/tests"]
skips = ["B105"]

[tool.vulture]
paths = ["server/app", "ci"]
min_confidence = 80
ignore_names = ["referer", "predicate", "user_data_dir", "user_agent", "accept_downloads"]

[tool.mutmut]
source_paths = ["server/app", "ci/quality_graph"]
also_copy = ["server/schema.sql", "server/migrations"]
