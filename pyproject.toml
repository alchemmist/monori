[project]
name = "monori"
version = "0.1.0"
description = "Monori"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { monori = "." }
packages = [
  "monori",
  "monori.common",
  "monori.ci",
  "monori.ci.lib",
  "monori.ci.quality_graph",
  "monori.ci.quality_graph.checks",
  "monori.ci.quality_graph.templates",
  "monori.ci.tests",
  "monori.server",
  "monori.server.app",
  "monori.server.app.connectors",
  "monori.server.app.routers",
  "monori.server.app.workbook",
  "monori.server.migrations",
  "monori.server.migrations.versions",
  "monori.server.tests",
  "monori.server.tests.integration",
  "monori.server.tests.unit",
]
include-package-data = true

[tool.setuptools.package-data]
"monori.ci.quality_graph" = ["templates/*.j2"]
"monori.server" = ["schema.sql"]

[dependency-groups]
format = ["ruff==0.15.22"]
ci = ["PyYAML>=6.0"]
lint = ["ruff==0.15.22", "dulwich>=0.25.0", "fastapi>=0.115", "httpx>=0.27", "jinja2>=3.1", "pydantic>=2"]
test = [
  "dulwich>=0.25.0", "fastapi>=0.115", "httpx[socks]>=0.27", "jinja2>=3.1", "pydantic>=2",
  "uvicorn[standard]>=0.30", "cryptography>=50", "pyjwt>=2.9", "argon2-cffi>=23",
  "python-multipart>=0.0.9", "alembic>=1.18.5", "openpyxl>=3.1", "playwright>=1.40",
  "httpx2>=0.1",
  "pytest>=8",
  "pytest-cov>=5",
]
type = [
  "dulwich>=0.25.0", "fastapi>=0.115", "httpx[socks]>=0.27", "jinja2>=3.1", "pydantic>=2",
  "uvicorn[standard]>=0.30", "cryptography>=50", "pyjwt>=2.9", "argon2-cffi>=23",
  "python-multipart>=0.0.9", "alembic>=1.18.5", "openpyxl>=3.1", "playwright>=1.40",
  "mypy>=1.13",
  "types-openpyxl>=3.1.5.20260724",
  "types-PyYAML>=6.0.12.20250516",
  "PyYAML>=6.0",
  "google-api-python-client>=2.0",
  "google-api-python-client-stubs>=1.39.0",
  "google-auth>=2.0",
  "google-auth-stubs>=0.2",
  "httpx2>=0.1",
  "pytest>=8",
]
analyze = [
  "bandit>=1.8",
  "vulture>=2.16",
]
audit = ["pip-audit>=2.10.1"]
mutation = [
  { include-group = "test" },
  "mutmut>=3.6.0",
]
runtime = [
  "dulwich>=0.25.0", "fastapi>=0.115", "httpx[socks]>=0.27", "jinja2>=3.1", "pydantic>=2",
  "uvicorn[standard]>=0.30", "cryptography>=50", "pyjwt>=2.9", "argon2-cffi>=23",
  "python-multipart>=0.0.9", "alembic>=1.18.5", "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["server/tests", "ci/tests"]
markers = ["integration: integration test that stands up real dependencies"]

[tool.coverage.run]
source = ["common", "ci", "server"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["common", "ci", "server"]
exclude = ["web/prototypes"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D212"]

[tool.ruff.lint.isort]
known-first-party = ["monori"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["N999"]
"server/tests/**/*.py" = [
  "D102", "D103", "PLR2004", "S101", "D101", "S106", "S107",
  "D100", "S105", "D107", "D105", "D104", "F401"
]
"ci/tests/**/*.py" = [
  "D102", "D103", "PLR2004", "S101", "D101", "S106", "S107",
  "D100", "S105", "D107", "D105", "D104", "F401"
]
"server/migrations/**/*.py" = ["S101", "INP001"]
"server/app/workbook/parser.py" = ["RUF001"]
"server/app/connectors/tbank_playwright.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["common", "ci", "server"]
exclude = ['(^|/)mutants/']
strict = true
warn_unreachable = true
extra_checks = true
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
warn_return_any = true
enable_error_code = [
  "explicit-override", "mutable-override", "truthy-bool", "truthy-iterable",
  "possibly-undefined", "redundant-expr", "unused-awaitable", "ignore-without-code"
]

[tool.bandit]
exclude_dirs = ["server/tests", "ci/tests"]
skips = ["B105"]

[tool.vulture]
paths = ["common", "ci", "server"]
min_confidence = 80
ignore_names = ["referer", "predicate", "user_data_dir", "user_agent", "accept_downloads"]

[tool.mutmut]
source_paths = ["server/app", "ci/lib", "ci/quality_graph", "common"]
also_copy = ["server/schema.sql", "server/migrations", "ci/quality_graph/templates"]
