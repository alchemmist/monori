include_fragments = "anchor-only"
max_retries = 2
retry_wait_time = 1
timeout = 10
max_concurrency = 32
host_concurrency = 4
no_progress = true
user_agent = "monori-docs-link-check/1.0"

exclude = [
    "^http://localhost(?::[0-9]+)?(?:/.*)?$",
    # github.com blob/view pages are aggressively rate-limited on CI runners
    # (intermittent 503 Service Unavailable) even with the job token; these are
    # valid documentation links to the Vite React plugin repos.
    '^https://github\.com/vitejs/vite-plugin-react/blob/(?:main|master)/packages/plugin-react(?:-swc)?$',
]
